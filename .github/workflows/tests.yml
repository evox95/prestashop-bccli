name: tests

on: [push, pull_request]

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.1', '7.4', '8.0', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: PHP 7.1 syntax compatibility
        if: matrix.php == '7.1'
        run: |
          set -euo pipefail
          php -l bccli.php
          find src -type f -name '*.php' -print0 | xargs -0 -n 1 php -l
      - run: php tests/run-unit.php

  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        prestashop: ['1.7.8', '8.0', '8.1', '8.2']
    services:
      mysql:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prestashop
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Start PrestaShop ${{ matrix.prestashop }}
        env:
          PS_VERSION: ${{ matrix.prestashop }}
        run: |
          set -euo pipefail
          docker run -d --name ps --network host \
            -e DB_SERVER=127.0.0.1 -e DB_USER=root -e DB_PASSWD=root \
            -e PS_INSTALL_AUTO=1 -e PS_DEV_MODE=0 \
            "prestashop/prestashop:${PS_VERSION}"

          # Two readiness signals that look right and are not:
          #
          #  - config/settings.inc.php: in PrestaShop 8 it ships inside the
          #    image as a 23-byte "@deprecated 1.7" stub, so it exists before
          #    the installer starts. Waiting on it ran the suite against an
          #    empty database, failing in Shop::initialize().
          #  - the ps_shop table: created early, while the installer is still
          #    populating everything else. The suite then found no image
          #    formats and no fixtures.
          #
          # Wait for ps_image_type to be POPULATED instead: it is the last of
          # the tables this suite depends on, and it is what regeneration
          # actually reads.
          timeout 900 bash -c '
            until docker exec ps php -r "
              \$p = \"/var/www/html/app/config/parameters.php\";
              if (!is_file(\$p)) { exit(1); }
              \$c = require \$p;
              \$c = \$c[\"parameters\"];
              try {
                \$pdo = new PDO(
                  \"mysql:host=\" . \$c[\"database_host\"] . \";dbname=\" . \$c[\"database_name\"],
                  \$c[\"database_user\"], \$c[\"database_password\"]
                );
                \$t = \$c[\"database_prefix\"] . \"image_type\";
                \$n = \$pdo->query(\"SELECT COUNT(*) FROM \$t\")->fetchColumn();
                exit(\$n > 0 ? 0 : 1);
              } catch (Throwable \$e) { exit(1); }
            " 2>/dev/null; do sleep 5; done
          '
          # The installer writes its last records and then finishes housekeeping;
          # give it a moment so the suite never races the tail of the install.
          sleep 15
          echo "PrestaShop is installed: $(docker exec ps php -r '
            $c = require "/var/www/html/app/config/parameters.php";
            $c = $c["parameters"];
            $pdo = new PDO("mysql:host=" . $c["database_host"] . ";dbname=" . $c["database_name"], $c["database_user"], $c["database_password"]);
            echo $pdo->query("SELECT COUNT(*) FROM " . $c["database_prefix"] . "image_type")->fetchColumn(), " image formats";
          ')"

      - name: Install the module and run the suite
        run: |
          set -euo pipefail
          docker cp . ps:/var/www/html/modules/bccli
          docker exec ps php bin/console prestashop:module install bccli --env=prod --no-debug
          docker exec ps php bin/console cache:clear --env=prod --no-debug
          docker exec ps php /var/www/html/modules/bccli/tests/run-integration.php

      - name: Container logs on failure
        if: failure()
        run: docker logs --tail 80 ps
